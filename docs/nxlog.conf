########################################################################
## NXLog Community Edition 3.2
## Windows Server 2012 R2 - forward Security Event Log
## Cil: syslog UDP 172.29.14.92:514  (rsyslog / isemon)
##
## POZOR: v <Exec> blocich nesmi byt zadne '#' komentare - radky se
## spojuji pres '\' do jedne logicke radky a komentar by uriznul zbytek.
########################################################################

define ROOT      C:\Program Files\nxlog
define LOGDIR    %ROOT%\data

## syslog hostname -> /var/log/remote/<TOHLE>/
define SYSLOGHOST   bdcx02
## syslog tag -> <TOHLE>.log
define SYSLOGTAG    WinSecurity

Moduledir    %ROOT%\modules
CacheDir     %ROOT%\data
Pidfile      %ROOT%\data\nxlog.pid
SpoolDir     %ROOT%\data
LogFile      %LOGDIR%\nxlog.log
LogLevel     INFO


########################################################################
## Extensions
########################################################################

<Extension _syslog>
    Module      xm_syslog
</Extension>

<Extension _charconv>
    Module              xm_charconv
    AutodetectCharsets  utf-8, windows-1250, iso8859-2, utf-16, utf-32
</Extension>


########################################################################
## Input - Security log
##
## Volitelne potlaceni sumu: na tomhle DC tvorilo 4662 zhruba 18 %
## vsech udalosti. Odkomentovanim Exec radky nize objem vyrazne klesne.
########################################################################

<Input eventlog_security>
    Module          im_msvistalog
    SavePos         TRUE
    ReadFromLast    TRUE

    <QueryXML>
        <QueryList>
            <Query Id="0">
                <Select Path="Security">*</Select>
            </Query>
        </QueryList>
    </QueryXML>

#    Exec  if $EventID IN (4656, 4658, 4662, 4663, 4670, 4690, 5145, \
#                          5152, 5154, 5156, 5157, 5158, 5447) drop();
</Input>


########################################################################
## Output - syslog UDP
##
## Hlavicku RFC 3164 generuje to_syslog_bsd() z $EventTime, $Hostname
## a $SourceName - do $Message se cas ani hostname necpe.
## Kazde pole je pred pouzitim overene pres defined(): pokud je field
## u dane udalosti nedefinovany, konkatenace by zahodila celou zpravu.
########################################################################

<Output out_syslog>
    Module      om_udp
    Host        172.29.14.92
    Port        514

    Exec        $Hostname = '%SYSLOGHOST%';                              \
                $SourceName = '%SYSLOGTAG%';                             \
                delete($ProcessID);                                      \
                $SyslogFacility = 'SECURITY';                            \
                $SyslogSeverity = 'INFO';                                \
                if defined($EventType) and $EventType == 'AUDIT_FAILURE' \
                    $SyslogSeverity = 'WARNING';                         \
                if not defined($Message) $Message = '';                  \
                $Message = replace($Message, "\r\n", " ");               \
                $Message = replace($Message, "\n", " ");                 \
                $Message = replace($Message, "\r", " ");                 \
                $Message = replace($Message, "\t", " ");                 \
                if defined($EventID)                                     \
                    $Message = 'EventID=' + string($EventID) + ' | ' +   \
                               $Message;                                 \
                to_syslog_bsd();
</Output>


## --- Varianta TCP -----------------------------------------------------
## Zpravy nad 1500 B se pres UDP fragmentuji (u 4624 / 4662 bezne) a
## ztrata jednoho fragmentu znamena ztratu cele udalosti bez stopy.
## Pro prechod: zakomentuj <Output out_syslog> vyse, odkomentuj blok
## nize a v <Route> zmen cil na out_syslog_tcp.
##
# <Output out_syslog_tcp>
#     Module      om_tcp
#     Host        172.29.14.92
#     Port        514
#
#     Exec        $Hostname = '%SYSLOGHOST%';                            \
#                 $SourceName = '%SYSLOGTAG%';                           \
#                 delete($ProcessID);                                    \
#                 $SyslogFacility = 'SECURITY';                          \
#                 $SyslogSeverity = 'INFO';                              \
#                 if defined($EventType) and $EventType == 'AUDIT_FAILURE' \
#                     $SyslogSeverity = 'WARNING';                       \
#                 if not defined($Message) $Message = '';                \
#                 $Message = replace($Message, "\r\n", " ");             \
#                 $Message = replace($Message, "\n", " ");               \
#                 $Message = replace($Message, "\r", " ");               \
#                 $Message = replace($Message, "\t", " ");               \
#                 if defined($EventID)                                   \
#                     $Message = 'EventID=' + string($EventID) + ' | ' + \
#                                $Message;                               \
#                 to_syslog_bsd();
# </Output>


########################################################################
## Route
########################################################################

<Route security_to_syslog>
    Path        eventlog_security => out_syslog
</Route>
