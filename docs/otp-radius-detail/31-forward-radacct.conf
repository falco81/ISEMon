# /etc/rsyslog.d/31-forward-radacct.conf
#
# Forwards every message on facility local5 to the central collector.
# What writes to local5 is /usr/local/sbin/radacct-syslog-ship.py
# (the contents of /var/log/radius/radacct, one detail record to one
# message, tagged "radius-detail").
#
# The FreeRADIUS configuration is not touched.

local5.*   @COLLECTOR:514;RSYSLOG_ForwardFormat

# Uncomment if you do NOT also want these messages in /var/log/messages.
# It must come AFTER the forward.
#local5.*   ~

# NOTE: a longer detail record goes past the 2048 B default and rsyslog
# cuts it off. Add this to /etc/rsyslog.conf, ON THE VERY FIRST LINE
# (before every $ModLoad and every rule):
#
#   $MaxMessageSize 8192
#
# The same value has to be set on the collector as well,
# or the receiving side cuts the message instead.
