########################################################################
## NXLog Community Edition 3.x
## Windows Server - NPS (Network Policy Server): forward its own log
## Target: isemon machine, syslog TCP 514 (rsyslog)
##
## What it sends: every line NPS writes to its log files, one syslog
## message per line, as it is written. The line itself is not changed;
## isemon finds the record wherever it starts on the line.
##
## CHANGE before use (the three defines below):
##   ISEMON      address or name of the isemon machine
##   SYSLOGHOST  the name the folder gets on the isemon machine:
##               /var/log/remote/<SYSLOGHOST>/IN.log
##               - that folder is what goes into isemon's
##               "Where the NPS logs are"
##   NPSLOGS     where NPS writes its logs (NPS console -> Accounting ->
##               Change Log File Properties -> Log File -> Directory)
##
## NPS has to write its log as "ODBC (Legacy)" with "Authentication
## requests" ticked - see docs/nps-logs.md.
##
## CAREFUL: no '#' comments inside an <Exec> block. Its lines are joined
## with '\' into one logical line, and a comment would cut off the rest.
########################################################################

define ROOT        C:\Program Files\nxlog
define LOGDIR      %ROOT%\data

define ISEMON      192.0.2.10
define SYSLOGHOST  nps01
define NPSLOGS     C:\Windows\System32\LogFiles

Moduledir    %ROOT%\modules
CacheDir     %ROOT%\data
Pidfile      %ROOT%\data\nxlog.pid
SpoolDir     %ROOT%\data
LogFile      %LOGDIR%\nxlog.log
LogLevel     INFO


########################################################################
## Extensions
########################################################################

<Extension _syslog>
    Module      xm_syslog
</Extension>

## NPS writes its files in the server's ANSI code page. A name with a
## diacritic in it arrives as UTF-8 either way.
<Extension _charconv>
    Module              xm_charconv
    AutodetectCharsets  utf-8, windows-1250, iso8859-2
</Extension>


########################################################################
## Input - the NPS log files
##
## IN*.log is both of NPS's namings: IN2609.log for a month, IN260929.log
## for a day. A new file is picked up by itself when NPS starts one.
##
## ReadFromLast TRUE: on the very first start only what is written from
## then on is sent. The months already on disk are better copied across
## once and read with `isemon --rescan --logs nps` than pushed through
## syslog - a month is half a gigabyte. Set it to FALSE to send them all
## the same way; SavePos makes sure nothing is sent twice after that.
##
## Accounting (4) that says nothing about an address is dropped here:
## isemon never reads it, and on a busy server it is most of the file (the
## switches' own probes alone are an accounting line every few seconds).
## Accounting that DOES carry the address a machine was given
## (Framed-IP-Address) is sent: it is the one place a wireless controller
## says it. Requests (1) and answers (2, 3) are what isemon needs most -
## both halves, always, or it cannot tell which door an answer was at.
## Challenges (11) are sent too (since isemon 1.10.95): NPS writes one
## only for an EAP conversation the machine walked away from, and isemon
## shows those as refusals, as ISE's 5440. They are a few hundred a day.
########################################################################

<Input nps_log>
    Module          im_file
    File            '%NPSLOGS%\IN*.log'
    SavePos         TRUE
    ReadFromLast    TRUE
    PollInterval    1

    Exec  if $raw_event =~ /^"[^"]*","IAS",[^,]*,[^,]*,4,("[^"]*"|[^,]*),("[^"]*"|[^,]*),("[^"]*"|[^,]*),("[^"]*"|[^,]*),("[^"]*"|[^,]*),,/ drop(); \
          $raw_event = convert($raw_event, "auto", "utf-8");
</Input>


########################################################################
## Output - syslog TCP
##
## TCP rather than UDP: a request and its answer are two lines, and
## losing one of them loses the pair. om_tcp keeps what it could not send
## and sends it when the isemon machine is back.
##
## Hostname and tag decide where rsyslog on the isemon machine files it:
## deploy/nps/06-nps-store.conf writes /var/log/remote/<host>/IN.log for
## everything tagged "nps".
########################################################################

<Output out_isemon>
    Module      om_tcp
    Host        %ISEMON%
    Port        514

    Exec        $Message = $raw_event;                                   \
                $Hostname = '%SYSLOGHOST%';                              \
                $SourceName = 'nps';                                     \
                delete($ProcessID);                                      \
                $SyslogFacility = 'LOCAL5';                              \
                $SyslogSeverity = 'INFO';                                \
                to_syslog_bsd();
</Output>


## --- UDP instead -------------------------------------------------------
## Only where TCP 514 cannot be opened. A lost datagram is a lost line,
## and a lost line is a request without its answer, or the other way
## round - neither of which isemon can show. Swap the Route to use it.
##
# <Output out_isemon_udp>
#     Module      om_udp
#     Host        %ISEMON%
#     Port        514
#
#     Exec        $Message = $raw_event;                                 \
#                 $Hostname = '%SYSLOGHOST%';                            \
#                 $SourceName = 'nps';                                   \
#                 delete($ProcessID);                                    \
#                 $SyslogFacility = 'LOCAL5';                            \
#                 $SyslogSeverity = 'INFO';                              \
#                 to_syslog_bsd();
# </Output>


########################################################################
## Route
########################################################################

<Route nps_to_isemon>
    Path        nps_log => out_isemon
</Route>
