; What PHP is allowed to accept on this one page.
;
; Everything the dashboard does is a few kilobytes of JSON, with two
; exceptions: a configuration going in, and a copy of the database going in or
; out. A database is the whole of what this daemon has ever recorded - tens of
; megabytes on a new machine and a gigabyte or two after a year - and PHP's own
; defaults are two megabytes, which refuses it before it reaches the daemon and
; says nothing useful about why.
;
; PHP reads this file per directory under php-fpm, so it applies to the
; dashboard and to nothing else on the machine. It is re-read every five
; minutes; `systemctl restart php-fpm` makes a change take at once.
;
; nginx has its own limit for the same thing - client_max_body_size, in
; nginx-isemon.conf - and the smaller of the two is what actually applies.
upload_max_filesize = 4G
post_max_size = 4G

; Uploading a gigabyte and writing it out again is not instant, and the
; default thirty seconds cuts it off in the middle.
max_execution_time = 900

; Nothing here is held in memory: the file goes from the browser to a
; temporary file, and from there to the daemon a lump at a time. This is
; headroom for the rest of the page, not for the file.
memory_limit = 256M

; php2shell (CVE-2026-109618, CVE-2026-109619, 21 October 2026): remote code
; execution through how PHP takes a request's body apart - a multipart one,
; and its upload progress - before a line of this page has run, so nothing
; the page itself checks can stop it. Updating PHP is the fix; these keep this
; page out of the way of it until then, and cost it nothing: everything it is
; sent is JSON or, for a database put back, the file itself, both read from
; php://input, so PHP never has to take a body apart here at all.
enable_post_data_reading = Off
session.upload_progress.enabled = 0
session.use_strict_mode = 1
