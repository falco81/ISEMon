# /etc/rsyslog.d/00-isemon-permissions.conf
#
# What every file and folder rsyslog creates under /var/log/remote from now
# on looks like. The number 00 is the whole point: these are defaults, and
# rsyslog applies them to actions defined AFTER them. Named 50- it would be
# read after the file that writes the ISE logs and would change nothing.
#
# The folder matters as much as the file. A new sender means a folder
# rsyslog creates by itself, and with the built-in default of 0700 root:root
# nobody but root can even walk into it - so the one thing nobody thinks to
# check is the one thing that breaks the day a third ISE node appears.
#
# The group is the account the daemon runs as:
#   systemctl show isemon -p User --value
#
# After editing:  systemctl restart rsyslog

$FileCreateMode 0640
$FileGroup      isemon
$DirCreateMode  0750
$DirGroup       isemon

# And the umask the service itself runs under, which is applied on top of
# everything above and can quietly undo it: 0640 & ~0066 is 0600. The
# packaged unit on some distributions ships UMask=0066 for exactly the
# reason it is wrong here.
#
#   systemctl show rsyslog -p UMask        # 0022 or 0027, not 0066
#
# If it is 0066:
#   mkdir -p /etc/systemd/system/rsyslog.service.d
#   printf '[Service]\nUMask=0022\n' > /etc/systemd/system/rsyslog.service.d/umask.conf
#   systemctl daemon-reload && systemctl restart rsyslog
$Umask 0022
