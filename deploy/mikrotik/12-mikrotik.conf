# /etc/rsyslog.d/12-mikrotik.conf - a MikroTik's own log, one folder per
# router and a file per topic, for Settings -> The firewall log, Kind
# MikroTik RouterOS. See docs/mikrotik-logs.md.
#
# Name the routers here: whatever arrives from these addresses is theirs.
# After editing:  rsyslogd -N1 && systemctl restart rsyslog

template(name="MikrotikFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

if ($fromhost-ip == '192.0.2.1') then {
    action(type="omfile" dynaFile="MikrotikFile"
           dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="root" dirGroup="isemon" fileOwner="root" fileGroup="isemon")
    stop
}
