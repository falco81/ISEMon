# /etc/rsyslog.d/99-isemon-permissions-end.conf
#
# The defaults 00-isemon-permissions.conf sets for /var/log/remote, set back
# for everything rsyslog writes after this file (1.10.375). Without it they
# also applied to the system's own logs - /var/log/secure, messages and maillog
# created afresh as root:isemon, and with the umask of 0022 the file before
# needs, readable by anybody. The receivers isemon installs say their modes
# on their own actions and are not touched by this.
#
# After editing:  systemctl restart rsyslog

$FileCreateMode 0600
$FileGroup      root
$DirCreateMode  0700
$DirGroup       root
