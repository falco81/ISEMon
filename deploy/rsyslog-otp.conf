# /etc/rsyslog.d/11-otp.conf
#
# Where the token servers' logs land, on a site that asks for a one-time
# password as well as a password. isemon reads these the way it reads the ISE
# logs - both servers, into one list - and never judges any of it: the
# address in such a record is the machine that asked, which is the token
# server itself.
#
# After editing:  systemctl restart rsyslog
#
# This is only needed if the token servers send their logs here over syslog.
# If they are written locally by the CGI itself, skip to "reading them" below:
# what matters is not who writes the files but that isemon can read them.

# ---- where it goes ---------------------------------------------------------
# One folder per token server, named after the server, with the program's own
# name as the file - which for the usual CGI is totp.cgi.log.
template(name="OTPFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

if ($programname == "totp.cgi") then {
    action(type="omfile" dynaFile="OTPFile"
           dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="root" dirGroup="isemon"
           fileOwner="root" fileGroup="isemon")
    stop
}

# ---- reading them ----------------------------------------------------------
# isemon does not run as root and never has. A folder made before this file
# existed - by an older rsyslog rule, or by hand - is usually 0700 root:root,
# and the daemon then says "Permission denied" against that file on the front
# page and in `isemon --status`. That is this, and it is one command:
#
#   chgrp -R isemon /var/log/remote/otp  /var/log/remote/otpsec
#   chmod 750       /var/log/remote/otp  /var/log/remote/otpsec
#   chmod 640       /var/log/remote/otp/*.log /var/log/remote/otpsec/*.log
#
# The rule above then keeps every file it creates from now on readable the
# same way. Where the folders are not rsyslog's to create, an ACL does the
# same without changing who owns anything:
#
#   setfacl -R  -m u:isemon:rx /var/log/remote/otp
#   setfacl -R -d -m u:isemon:r /var/log/remote/otp
#
# ---- rotation --------------------------------------------------------------
# Rotate them as you would any other log, and have logrotate recreate them
# readable:
#
#   create 0640 root isemon
#
# isemon notices a file that has been renamed or emptied, reads whatever was
# written to the old one after its last read, and carries on with the new one
# from its beginning. Nothing is lost and nothing is counted twice.
#
# One rule covers the whole of /var/log/remote, these folders included -
# logrotate refuses two rules that match the same file. Ready to copy:
# deploy/remote-logs.logrotate, explained in
# docs/log-rotation-and-permissions.md.
