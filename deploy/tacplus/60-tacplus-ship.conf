# /etc/rsyslog.d/60-tacplus-ship.conf             ON THE tac_plus SERVER
#
# The accounting file - who ran what on which switch. tac_plus writes it
# itself rather than through syslog, so it is read as it grows and sent on.
# Nothing is added to the line and nothing is taken off it.
#
# Replace ISEMON with the machine isemon runs on, and the File= path with
# the `accounting file` your running tac_plus.conf names (see
# docs/tacplus-setup.md, step 1).
#
# The first time this starts it sends the WHOLE file, years of it at once.
# That is how the history gets across, and isemon 1.10.85 and later date
# every one of those lines by what is written on it, not by when it was sent.
#
# The queue keeps whatever is written while the isemon machine is away on
# disk here, and sends it when it is back.

module(load="imfile")

input(type="imfile"
      File="/var/log/tacacs/tac_acct.log"
      Tag="tac_acct:"
      ruleset="tacplus_acct")

ruleset(name="tacplus_acct") {
    action(type="omfwd" target="ISEMON" port="514" protocol="tcp"
           template="RSYSLOG_ForwardFormat"
           queue.type="LinkedList" queue.filename="tacplus_acct"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
}
