# /etc/rsyslog.d/50-tacplus.conf                  ON THE tac_plus SERVER
#
# The daemon's own messages - the only place a sign-in that was TURNED AWAY
# is written down. A copy stays here, and each one goes straight on to the
# isemon machine as it happens, so the stamp on it is the moment it happened.
#
# Replace ISEMON with the machine isemon runs on (a name or an address).
# Written for CentOS 7's rsyslog 8.24; works unchanged on anything newer.
#
# Check before restarting:   rsyslogd -N1 && systemctl restart rsyslog
#
# `stop` at the end means these no longer go into /var/log/messages as well.

if $programname == 'tac_plus' then {
    action(type="omfile" file="/var/log/tacacs/tac_plus.log")
    action(type="omfwd" target="ISEMON" port="514" protocol="tcp"
           template="RSYSLOG_ForwardFormat"
           queue.type="LinkedList" queue.filename="tacplus_said"
           queue.saveOnShutdown="on" action.resumeRetryCount="-1")
    stop
}
