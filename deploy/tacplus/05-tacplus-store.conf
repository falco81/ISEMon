# /etc/rsyslog.d/05-tacplus-store.conf            ON THE isemon MACHINE
#
# Where the tac_plus server's two logs land: one folder per sending host
# under /var/log/remote, exactly as the ISE logs are stored
# (deploy/rsyslog-ise.conf), readable by the isemon group.
#
# RSYSLOG_FileFormat writes a full stamp in front of each line - the year,
# the zone, to the microsecond - then the host and the tag, then the line as
# tac_plus wrote it. isemon reads that shape as it stands.
#
# It must come BEFORE whatever rule stores everything else that arrives,
# because of the `stop`: files in rsyslog.d are read in name order, and 05
# comes before 10-ise.conf. The listeners (imudp/imtcp on 514) are in
# 10-ise.conf and serve this file too.
#
# The host's name becomes a directory name, and it arrives over the
# network, which is why it goes through secpath-replace.
#
# Check before restarting:   rsyslogd -N1 && systemctl restart rsyslog

template(name="tacplusAcctFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/tac_acct.log")
template(name="tacplusSaidFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/tac_plus.log")

if $programname == 'tac_acct' then {
    action(type="omfile" dynaFile="tacplusAcctFile" template="RSYSLOG_FileFormat"
           dirCreateMode="0750"  dirOwner="root"  dirGroup="isemon"
           fileCreateMode="0640" fileOwner="root" fileGroup="isemon")
    stop
}
if $programname == 'tac_plus' then {
    action(type="omfile" dynaFile="tacplusSaidFile" template="RSYSLOG_FileFormat"
           dirCreateMode="0750"  dirOwner="root"  dirGroup="isemon"
           fileCreateMode="0640" fileOwner="root" fileGroup="isemon")
    stop
}
