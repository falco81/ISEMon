# /etc/rsyslog.d/11-acme.conf
#
# Where acme - the certificate manager - files what it sends here (acme's
# Settings -> isemon: isemon=1, isemon_targets=<this machine>:514/tcp, or
# :6514/tls once Settings -> The acme logs -> Encrypted receiving is set up).
# isemon reads these when Settings -> The acme logs is switched on, and shows
# them on its acme tab. Nothing of it is ever judged.
#
# After editing:  systemctl restart rsyslog
#
# Three programs, one file each, in one folder per HOST - the HOST being
# isemon_hostname in acme, one for the whole cluster (each node says its own
# name in every line, node=acme1):
#
#   /var/log/remote/acme/acme-certs.log   what happened to the certificates
#   /var/log/remote/acme/acme.log         the rest (isemon_events=1 in acme)
#   /var/log/remote/acme/acme-jobs.log    every job step by step, every check
#                                         (isemon_detail=1 in acme, from 1.0.44)
#
# The same as acme's own deploy/isemon/11-acme.conf - one of the two is
# enough; acme 1.0.43's left acme-jobs out, so take this one or acme 1.0.44's.
# acme-jobs lines run to 900 bytes and more: over UDP raise $MaxMessageSize,
# or send over TCP or TLS. What arrives over TLS is filed by this rule too.

template(name="AcmeFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

if ($programname == "acme-certs" or $programname == "acme" or $programname == "acme-jobs") then {
    action(type="omfile" dynaFile="AcmeFile"
           dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="root" dirGroup="isemon"
           fileOwner="root" fileGroup="isemon")
    stop
}

# ---- reading them ----------------------------------------------------------
# isemon does not run as root. A folder made before this file existed is
# usually 0700 root:root, and the Logs tab then says "Permission denied":
#
#   chgrp -R isemon /var/log/remote/acme
#   chmod 750       /var/log/remote/acme
#   chmod 640       /var/log/remote/acme/*.log
#
# ---- rotation --------------------------------------------------------------
# One rule covers the whole of /var/log/remote, this folder included:
# deploy/remote-logs.logrotate, explained in
# docs/log-rotation-and-permissions.md. isemon notices a file renamed or
# emptied and carries on with the new one; a line read twice is kept once.
