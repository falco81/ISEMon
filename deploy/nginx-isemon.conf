# /etc/nginx/conf.d/isemon.conf
#
# The isemon dashboard on its own hostname. Port 80 redirects to 443;
# everything real is served over TLS.
#
# This block deliberately does NOT claim default_server, so it coexists with
# anything else on the same nginx: nginx picks the block by the Host header.
#
# The dashboard can ban addresses and write to a firewall, so it stays
# restricted by address as well as encrypted — TLS protects the traffic, the
# allow rules decide who may knock at all, and the sign-in decides who may do
# anything once they are in.

# ---------------------------------------------------------------------------
# How often one address may try to sign in
# ---------------------------------------------------------------------------
# Refusing a flood belongs here rather than in the daemon: the daemon already
# makes an address wait after a few wrong passwords, but answering a thousand
# attempts a second to tell them so still costs a php-fpm worker and a thread
# each time.
#
# The counting is on SIGNING IN and nothing else. nginx cannot match a query
# string in a `location`, so the key is built from it here instead: a request
# carrying ?api=login is counted against the address it came from, and every
# other request gets an empty key, which nginx takes to mean "do not count
# this one at all".
#
# This used to limit the whole of /index.php, and an open dashboard asks it
# twelve times a minute by itself - so anybody who left a tab open was shown
# 429 within seconds. The limit was right; what it was counting was not.
map $arg_api $isemon_login_key {
    "login"   $binary_remote_addr;
    default   "";
}
limit_req_zone $isemon_login_key zone=isemon_login:1m rate=20r/m;

# ...and a second, looser one over everything, because the first can be
# walked around by how the argument is spelled: nginx matches `$arg_api`
# against the raw query string, while PHP decodes the name and takes the last
# of any duplicates - so `?%61pi=login` or `?api=x&api=login` is a sign-in
# attempt that the map above scores as "do not count". Guessing passwords is
# still held by the daemon's own five-per-fifteen-minutes, so what this stops
# is a flood of requests, each of which costs a php-fpm worker and a thread.
# The rate is well above what an open dashboard asks for (about twelve a
# minute) with a burst for a page that has just been opened.
limit_req_zone $binary_remote_addr zone=isemon_all:10m rate=10r/s;

# ---------------------------------------------------------------------------
# Plain HTTP: redirect and nothing else
# ---------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name blacklistmt.example.loc;      # <- your hostname

    server_tokens off;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS: the dashboard
# ---------------------------------------------------------------------------
server {
    # The old spelling on purpose. `http2 on;` as a directive of its own is
    # nginx 1.25 and later; AlmaLinux 9, RHEL 9 and Rocky 9 all ship 1.20,
    # where it is an unknown directive and nginx refuses to start at all.
    # This form works on every version there is - 1.25 accepts it and warns.
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name blacklistmt.example.loc;      # <- your hostname

    root  /var/www/isemon;
    index index.php;

    server_tokens off;

    access_log /var/log/nginx/isemon-access.log;
    error_log  /var/log/nginx/isemon-error.log;

    # ---- certificates ----------------------------------------------------
    # nginx sends ssl_certificate to clients verbatim, so whatever chain the
    # browser sees is whatever server.pem contains. If a browser ever says the
    # certificate is untrusted, check how many certificates are in it:
    #   grep -c "BEGIN CERTIFICATE" /etc/nginx/certs/isemon.pem
    ssl_certificate           /etc/nginx/certs/isemon.pem;
    ssl_certificate_key       /etc/nginx/certs/isemon.key;

    # ---- protocol --------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:secp384r1:prime256v1;
    ssl_session_cache         shared:ISEMON:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ---- who may connect -------------------------------------------------
    # Encryption is not authorisation. Restrict by address too: this page can
    # write to a firewall.
    allow 192.168.0.0/16;         # <- your own networks
    allow 172.16.0.0/12;
    allow 10.0.0.0/8;
    allow 127.0.0.1;
    allow ::1;
    deny  all;

    # ---- security headers ------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # The dashboard loads nothing from anywhere else — no CDN, no fonts, no
    # analytics — so it can be locked to itself. 'unsafe-inline' is needed
    # because the page carries its own <style> and <script> inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- request shape ---------------------------------------------------
    # A page of failed attempts with every field in it is a few hundred
    # kilobytes of JSON and a tenth of that compressed.
    gzip on;
    # text/html is always compressed and naming it again is a warning at start
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
    # A configuration import is a few kilobytes. Putting a copy of the
    # database back is the whole of what this daemon has ever recorded -
    # tens of megabytes on a new machine, a gigabyte or two after a year -
    # so the limit is what a database can be rather than what a settings
    # file is. PHP has its own limit for the same thing, in web/.user.ini,
    # and the smaller of the two is what applies. Nothing is held in memory
    # at either end: the body goes to a temporary file and from there to the
    # daemon a lump at a time.
    client_max_body_size 4g;
    client_body_timeout  900s;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    # php2shell (CVE-2026-109618, CVE-2026-109619): a multipart body is taken
    # apart by PHP before any of the page runs. Nothing here sends one - the
    # page sends JSON, and a database put back is sent as the file itself -
    # so none is let through to PHP at all. (isemon 1.10.218)
    if ($http_content_type ~* "multipart") { return 403; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Signing in is the one road worth rate-limiting: everything else needs a
    # session, and a session is what this road hands out. The zone above is
    # keyed so that only ?api=login is counted; everything else passes through
    # this untouched.
    location = /index.php {
        limit_req zone=isemon_login burst=10 nodelay;
        limit_req zone=isemon_all   burst=40 nodelay;
        limit_req_status 429;

        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        # Filling a country list on a router is minutes of ssh — but it is a
        # job the page watches rather than waits for, so nothing here should
        # ever need longer than this. The one thing that does is putting a
        # copy of the database back: that is a gigabyte arriving and then
        # being written out again, and it cannot be a job because there is
        # nothing to watch it with once the database has been replaced.
        fastcgi_read_timeout 900s;
        fastcgi_send_timeout 900s;
    }

    # The shared library beside index.php is not an entry point. It prints
    # nothing today - it is functions and constants - but it is not meant to
    # be reachable, and a file that is reachable is a file somebody will one
    # day put a side effect in.
    location = /isemon-api.php { return 404; }

    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   unix:/run/php-fpm/www.sock;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  HTTPS on;
        include        fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # The flags are two hundred and fifty small files that never change.
    #
    # `expires` alone, with no `add_header` of its own: a block that sets one
    # header replaces the whole inherited set rather than adding to it, so
    # the `add_header Cache-Control` that used to be here quietly took the
    # security headers off every flag - and a flag is an SVG, which is a
    # document a browser will run script in if it is opened on its own.
    location /flags/ {
        expires 30d;
        access_log off;
    }

    location ~ /\.        { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
