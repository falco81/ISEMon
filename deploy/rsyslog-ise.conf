# /etc/rsyslog.d/10-ise.conf
#
# Where the two ISE nodes' logs land. isemon does not receive syslog itself —
# rsyslog is already on the machine, already runs as root, already handles
# rotation and restarts, and is better at all of it. This file only says where
# to put what arrives; isemon reads the files.
#
# After editing:  systemctl restart rsyslog
#
# ISE is told to send to this machine under Administration → System → Logging
# → Remote Logging Targets, as UDP or TCP, with the categories "Failed
# Attempts" and "Passed Authentications" pointed at it.

# ---- listen ----------------------------------------------------------------
# ISE sends UDP by default. TCP is worth having as well: a failed attempt is
# what a ban is made of, and UDP drops the busy ones first, which is exactly
# when they matter.
module(load="imudp")
input(type="imudp" port="514")

module(load="imtcp")
input(type="imtcp" port="514")

# ---- where it goes ---------------------------------------------------------
# One folder per node, named after the node, and one file per category inside
# it. isemon watches both folders all the time, because which node is doing
# the authenticating changes without warning.
#
# $.node is the sending host with anything that is not a letter, a digit or a
# dash taken out: it becomes a directory name, and a directory name built from
# something arriving over the network is worth being careful with.
template(name="ISEFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

# Only the two categories isemon reads. Everything else ISE sends — and it
# sends a great deal — goes wherever this machine's ordinary rules send it,
# rather than filling a disk with logs nothing looks at.
if ($programname == "CISE_Failed_Attempts"
    or $programname == "CISE_Passed_Authentications") then {
    action(type="omfile" dynaFile="ISEFile"
           dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="root" dirGroup="isemon"
           fileOwner="root" fileGroup="isemon")
    stop
}

# ---- reading them ----------------------------------------------------------
# The files are written by root and read by isemon, which is why they are
# created with the isemon group above. For folders that already existed
# before isemon was installed:
#
#   chgrp -R isemon /var/log/remote
#   find /var/log/remote -type d -exec chmod 750 {} +
#   find /var/log/remote -type f -exec chmod 640 {} +
#
# An ACL does the same without changing who owns anything, and a default one
# on the folder is inherited by every file made in it afterwards - logrotate's
# included. It is a belt rather than the braces: it is masked by the file's
# own mode, so a file created 0600 is unreadable however good `getfacl`
# looks, and it is not there at all on a folder rsyslog creates tomorrow.
#
#   setfacl -R -m u:isemon:rx  /var/log/remote
#   setfacl -R -d -m u:isemon:r /var/log/remote
#
# ---- rotation --------------------------------------------------------------
# isemon notices a file that has been renamed or emptied, reads whatever was
# written to the old one after its last read, and carries on with the new one
# from its beginning: nothing is lost and nothing is read twice. What it
# cannot do anything about is a rotated-in file it may not read, so the group
# on logrotate's `create` has to be this one:
#
#   create 0640 root isemon
#
# Ready to copy: deploy/remote-logs.logrotate, and the whole procedure with
# it in docs/log-rotation-and-permissions.md.
