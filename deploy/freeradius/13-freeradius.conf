# /etc/rsyslog.d/13-freeradius.conf - a FreeRADIUS of the site's own,
# radius.log one folder per server, for Settings -> The FreeRADIUS logs.
# The accounting detail files are shipped as docs/freeradius-rsyslog-forwarding.md
# describes. See docs/freeradius-logs.md.
#
# After editing:  rsyslogd -N1 && systemctl restart rsyslog

template(name="FreeradiusLog" type="string"
         string="/var/log/remote/radius/%HOSTNAME:::secpath-replace%/radius.log")

if ($programname == 'radiusd' or $programname == 'radius' or $programname == 'freeradius')
        and ($msg contains ': Auth:') then {
    action(type="omfile" dynaFile="FreeradiusLog"
           dirCreateMode="0750" fileCreateMode="0640"
           dirOwner="root" dirGroup="isemon" fileOwner="root" fileGroup="isemon")
    stop
}
