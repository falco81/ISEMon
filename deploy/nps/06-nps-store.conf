# /etc/rsyslog.d/06-nps-store.conf                ON THE isemon MACHINE
#
# Where a Windows NPS server's log lands when NXLog sends it
# (docs/nxlog-nps.conf): one folder per NPS server under /var/log/remote,
# exactly as the ISE and domain controller logs are stored, readable by the
# isemon group.
#
#   /var/log/remote/<host>/IN.log
#
# The name is IN.log so that isemon's default pattern, IN*.log, finds it. In
# Settings -> The NPS logs, "Where the NPS logs are" is the folder:
# /var/log/remote/<host>, one per NPS server.
#
# RSYSLOG_FileFormat puts a full stamp, the host and the tag in front of each
# line and leaves the line itself as NPS wrote it. isemon finds the record
# wherever it starts on the line, and dates it by the NPS server's own date
# and time inside it, not by the stamp in front.
#
# It must come BEFORE whatever rule stores everything else that arrives,
# because of the `stop`: files in rsyslog.d are read in name order, and 06
# comes before 10-ise.conf. The listeners (imudp/imtcp on 514) are in
# 10-ise.conf and serve this file too - NXLog sends over TCP.
#
# The host's name becomes a directory name, and it arrives over the network,
# which is why it goes through secpath-replace.
#
# Rotation: the one rule for /var/log/remote/*/*.log (deploy/
# remote-logs.logrotate) covers this file too. isemon follows a rotated file
# by its inode and reads what was written to it after its last read, and
# `isemon --rescan --logs nps` goes back over the rotated copies as well.
#
# Check before restarting:   rsyslogd -N1 && systemctl restart rsyslog

template(name="npsFile" type="string"
         string="/var/log/remote/%HOSTNAME:::secpath-replace%/IN.log")

if $programname == 'nps' then {
    action(type="omfile" dynaFile="npsFile" template="RSYSLOG_FileFormat"
           dirCreateMode="0750"  dirOwner="root"  dirGroup="isemon"
           fileCreateMode="0640" fileOwner="root" fileGroup="isemon")
    stop
}
